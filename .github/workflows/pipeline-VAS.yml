name: PR Pipeline

on:
  push:
    branches:
      - pipeline-VAS
    paths:
      - 'backend/**'
      - '.github/workflows/pipeline-VAS.yml'

# Configuración de permisos mínimos
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          verify-commit: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Cache Prisma
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            backend/node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: backend-deps
          path: |
            backend/node_modules
            backend/node_modules/.prisma
          retention-days: 1

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: backend-deps
          path: backend/node_modules

      - name: Run Tests
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: test
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: backend-deps
          path: backend/node_modules

      - name: Build Application
        working-directory: ./backend
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(github.event.head_commit.message, '[deploy]')
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_INSTANCE }}
          USER: ubuntu
          APP_DIR: ~/app/backend
          BACKUP_DIR: ~/app/backups
          TIMESTAMP: $(date +%Y%m%d_%H%M%S)
        run: |
          # Configurar SSH
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          eval $(ssh-agent -s)
          ssh-add private_key.pem

          # Crear directorios necesarios
          ssh -o StrictHostKeyChecking=no ${USER}@${HOST} "
            mkdir -p ${APP_DIR}
            mkdir -p ${BACKUP_DIR}
          "

          # Backup actual
          ssh -o StrictHostKeyChecking=no ${USER}@${HOST} "
            if [ -d ${APP_DIR}/dist ]; then
              tar -czf ${BACKUP_DIR}/backup_${TIMESTAMP}.tar.gz -C ${APP_DIR} dist
            fi
          "

          # Copiar archivos al servidor
          scp -o StrictHostKeyChecking=no -r backend/dist/* ${USER}@${HOST}:${APP_DIR}/

          # Validar variables de entorno
          ssh -o StrictHostKeyChecking=no ${USER}@${HOST} "
            cd ${APP_DIR}
            if [ ! -f .env ]; then
              echo 'Error: .env file not found'
              exit 1
            fi
          "

          # Reiniciar la aplicación con health check
          ssh -o StrictHostKeyChecking=no ${USER}@${HOST} "
            cd ${APP_DIR}
            pm2 delete backend || true
            pm2 start dist/index.js --name backend
            sleep 5
            if ! pm2 show backend | grep -q 'online'; then
              echo 'Application failed to start'
              exit 1
            fi
          "

          # Limpieza
          rm -f private_key.pem
          ssh-agent -k

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const run_url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const message = `❌ Pipeline failed in job: ${context.job}\nView run: ${run_url}`;
            
            // Notify in PR comment
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: message
            }); 